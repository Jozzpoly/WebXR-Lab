name: Verify Riftworks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install locked dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Production build
        run: npm run build -- --emptyOutDir
      - name: Verify runtime fingerprint
        run: node scripts/verify-runtime-build-id.mjs
      - name: Desktop browser rehearsal
        run: node scripts/desktop-browser-smoke.mjs
      - name: IWER browser rehearsal
        run: node scripts/iwer-browser-smoke.mjs
      - name: Probe branch preview attribution
        id: preview-attribution
        if: github.event_name == 'pull_request' && github.head_ref == 'foundation-reset'
        continue-on-error: true
        env:
          RIFTWORKS_PREVIEW_URL: https://foundation-reset-webxr-lab.jozzpoly.workers.dev
          RIFTWORKS_PREVIEW_ATTEMPTS: 4
          RIFTWORKS_PREVIEW_DELAY_MS: 15000
        run: node scripts/verify-deployed-runtime.mjs
      - name: Summarize branch preview attribution
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'foundation-reset'
        run: |
          echo '### Branch preview attribution' >> "$GITHUB_STEP_SUMMARY"
          if [ '${{ steps.preview-attribution.outcome }}' = 'success' ]; then
            echo '- **PASS**: public branch preview exposes the exact runtime fingerprint built by this run.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '- **UNPROVEN**: repo verification is unaffected, but the public branch preview did not expose the exact runtime fingerprint during this probe.' >> "$GITHUB_STEP_SUMMARY"
          fi
