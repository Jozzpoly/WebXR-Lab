name: Verify Riftworks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Production build
        run: npm run build -- --emptyOutDir
      - name: IWER browser rehearsal
        run: node scripts/iwer-browser-smoke.mjs
