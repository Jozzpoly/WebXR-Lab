name: Verify Riftworks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install dependencies
        run: npm install
      - name: Verify resolved dependency snapshot
        run: test -s package-lock.json
      - name: Persist verified dependency lock once
        if: github.event_name == 'pull_request' && github.head_ref == 'foundation-reset' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/contents/package-lock.json?ref=${GITHUB_HEAD_REF}" >/dev/null 2>&1; then
            echo "package-lock.json already exists on ${GITHUB_HEAD_REF}; nothing to persist"
            exit 0
          fi
          encoded="$(base64 -w0 package-lock.json)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/package-lock.json" \
            -f message='Lock verified dependency graph' \
            -f content="$encoded" \
            -f branch="$GITHUB_HEAD_REF"
      - name: Run tests
        run: npm test
      - name: Production build
        run: npm run build -- --emptyOutDir
      - name: Verify runtime fingerprint
        run: node scripts/verify-runtime-build-id.mjs
      - name: Desktop browser rehearsal
        run: node scripts/desktop-browser-smoke.mjs
      - name: IWER browser rehearsal
        run: node scripts/iwer-browser-smoke.mjs
